<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>PicBrowse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/browse/" data-nav="" aria-label="PicBrowse home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4.5 17.5l5-5 3.5 3.5 2.5-2.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
    <div class="tools">
      <span class="count" id="count"></span>
      <label class="sort">
        <span class="sr-only">Sort by</span>
        <select id="sort">
          <option value="name">Name</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </label>
    </div>
  </header>

  <main id="main">
    <div class="status" id="status" hidden></div>
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Viewer">
    <div class="stage" id="stage"></div>
    <div class="vbar top">
      <span class="vtitle" id="vtitle"></span>
      <span class="vpos" id="vpos"></span>
      <a class="vbtn" id="vdownload" title="Download original" aria-label="Download original">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="vbtn" id="vfull" title="Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="vbtn" id="vclose" title="Close (Esc)" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button class="vnav prev" id="vprev" title="Previous (←)" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="vnav next" id="vnext" title="Next (→)" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
